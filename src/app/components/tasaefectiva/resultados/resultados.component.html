<div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <img src="assets/logo.png" alt="FactuWeb Logo" />
      </div>
      <h1>FactuWeb</h1>
      <button class="menu-button" (click)="goToDashboard()">Menú</button>
    </header>
  
    <!-- Título principal -->
    <h2>Resultados</h2>
  
    <!-- Resultados -->
    <section class="resultados">
      <div class="result-box">
        <label for="valorTotal">Valor Total a Recibir por la cartera</label>
        <input type="text" id="valorTotal" placeholder="Resultado" />
      </div>
      <div class="result-box">
        <label for="tasaCoste">Tasa de Coste Efectiva Anual de la cartera</label>
        <input type="text" id="tasaCoste" placeholder="Resultado" />
      </div>
    </section>
  
    <!-- Botón Guardar -->
    <div class="actions">
      <button>Guardar</button>
    </div>
  </div>
